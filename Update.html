<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/milligram/1.4.1/milligram.css">
</head>
<body>
    <h1>Update product:</h1>
    <div class="container">
        <div class="row">
            <div class="column">
                <label>Product ID</label>
                <input readonly type="text" id="ProductID">

                <label for="">Product IMG</label>
                <input type="text" id="ProductImg">

                <label for="">Product Name</label>
                <input type="text" id="ProductName">

                <label for="">Product Code</label>
                <input type="text" id="ProductCode">

                <label for="">Unit Price</label>
                <input type="text" id="UnitPrice">

                <label for="">Quantity</label>
                <input type="text" id="Quantity">

                <label for="">Total Price</label>
                <input type="text" id="TotalPrice">

                <button onclick="UpdateProduct()">Submit</button>

            </div>
        </div>

    </div>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script>

        // Getting existing product
        GetProductInfo();
        async function GetProductInfo(){
           const URLParams = new URLSearchParams(window.location.search); //Creating obj of URLSearchParams class
           const id = URLParams.get('id');
           let URL = `https://crud.teamrabbil.com/api/v1/ReadProductByID/${id}`;
           let response = await axios.get(URL);
           //console.log(response);

           let data = response.data['data'][0];
            
           document.getElementById("ProductID").value=id;
           document.getElementById("ProductImg").value = data['ProductImg'];
           document.getElementById("ProductName").value = data['ProductName'];
           document.getElementById("ProductCode").value = data['ProductCode'];
           document.getElementById("UnitPrice").value = data['UnitPrice'];
           document.getElementById("Quantity").value = data['Quantity'];
           document.getElementById("TotalPrice").value = data['TotalPrice'];
           
        }

        // Updating existing product
        async function UpdateProduct(){
            let productID = document.getElementById('ProductID').value;
            let ProductName = document.getElementById("ProductName").value;
            let ProductCode = document.getElementById("ProductCode").value;
            let ProductImg = document.getElementById("ProductImg").value;
            let UnitPrice = document.getElementById("UnitPrice").value;
            let Quantity = document.getElementById("Quantity").value;
            let TotalPrice = document.getElementById("TotalPrice").value;

            let obj = {
                "Img":ProductImg,
                "ProductName":ProductName,
                "ProductCode":ProductCode,
                "UnitPrice":UnitPrice,
                "Qty":Quantity,
                "TotalPrice":TotalPrice
            };
            let URL = `https://crud.teamrabbil.com/api/v1/UpdateProduct/${ProductID}`;
            let response = await axios.post(URL,obj);
            window.location="Perform Ajax1.html";
        }
    </script>
    
</body>
</html>
